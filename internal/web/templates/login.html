{{define "title"}}Sign in · MeshTender{{end}}
{{define "content"}}
<div class="card card-md">
  <div class="card-body">
    <h2 class="card-title text-center mb-4">Sign in to your account</h2>
    {{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}

    <form method="post" action="/login/password" id="signin-form">
      {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" autocomplete="username webauthn" autocapitalize="none" placeholder="your-username" required>
      </div>

      <div class="form-footer mt-0">
        <button type="button" class="btn btn-primary w-100" id="passkey-btn" onclick="passkeyButton()">{{template "icon-key" "me-2"}}Sign in with a passkey</button>
      </div>
      <p id="passkey-status" class="text-secondary text-center small mt-2 mb-0" style="min-height:1.2em"></p>

      <div class="hr-text">or use your password</div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group input-group-flat">
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
          <span class="input-group-text">
            <a href="#" class="link-secondary" role="button" aria-pressed="false" title="Show password" data-pwtoggle="password" aria-label="Show password">{{template "icon-eye" ""}}</a>
          </span>
        </div>
      </div>
      <div class="form-footer mt-0">
        <button type="submit" class="btn w-100">Sign in with password</button>
      </div>
    </form>
  </div>
</div>
<div class="text-center text-secondary mt-3">Don't have an account yet? <a href="/signup{{if .Next}}?next={{.Next}}{{end}}" tabindex="-1">Create one</a></div>
<script src="/static/webauthn.js"></script>
<script>document.addEventListener("DOMContentLoaded", initSigninPasskey);</script>
{{end}}
