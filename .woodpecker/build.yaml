# Builds the OCI image with ko, pushes it to the Forgejo registry, and (on main)
# rolls it out. Runs only after tests and lint pass, and only on the main branch
# and on tags (not PRs).
#
# Building and deploying share one workflow because the deploy needs the image
# DIGEST, and only the build step can know it: ko reports it with --image-refs
# after the push, and Woodpecker workflows have separate workspaces. Deploying by
# digest also means the running Deployment names an immutable artifact rather than
# a tag that could later be moved.
#
# There is no Dockerfile. MeshTender is a pure-Go single binary with migrations,
# templates, and static assets embedded via go:embed, so ko builds it and lays
# it straight onto the digest-pinned base image from .ko.yaml — no build
# context, no daemon, no privileged rootless-buildkit sandbox. ko talks to the
# registry over the HTTP API, authenticating with the same
# woodpecker-ci-registry secret, mounted at $DOCKER_CONFIG.
#
# The image is reproducible: the Go toolchain (the builder image tag), the ko
# version, and the base image digest are all pinned, and ko zeroes layer
# timestamps. An auditor can rebuild from a clean checkout of the tagged commit
# and get the same digest — see "Verifying a build" in README.md.
#
# ko is installed with `go install ko@<version>` rather than run from the
# upstream ko image on purpose: ko compiles the app with whatever Go is on
# PATH, so the Go version has to be the one we pinned, not whatever the ko
# image happens to bundle. `go install pkg@version` builds in an isolated
# module context, so it does not touch go.mod or the licensing audit.
when:
  - event: push
    branch: main
  - event: tag

# The licensing audit gates the build for the same reason the vuln scan does:
# a non-permissive dependency is a legal defect in the artifact, so it must not
# reach the registry. e2e is deliberately absent — it is non-gating.
#
# These four all declare `event: [push, pull_request]`, so none of them run on a
# tag; Woodpecker treats a filtered-out dependency as satisfied, which is why a
# tag build publishes without re-running them. It is riding on the checks that
# already passed for that commit on main.
depends_on:
  - test
  - lint
  - vuln
  - licenses

variables:
  # Keep the builder image, GOTOOLCHAIN, and the ko version in sync with the
  # pins in .config/mise/config.toml and the go.mod `go` directive.
  # TestReleasePinsAreConsistent enforces it. `go install` drops ko in
  # /go/bin, which is already on PATH in the official golang image.
  - &golang_image golang:1.26.5
  - &ko_env
    DOCKER_CONFIG: /root/.docker
    KO_DOCKER_REPO: git.leightha.us/ci/jleight/meshtender
    KO_VERSION: v0.19.1
    # Refuse to silently download a newer toolchain than the pinned one; the
    # builder image already carries it, so this is a guard, not a fetch.
    GOTOOLCHAIN: go1.26.5
  - &registry_secret
    kubernetes:
      secrets:
        - name: woodpecker-ci-registry
          key: .dockerconfigjson
          target:
            file: /root/.docker/config.json

steps:
  publish:
    image: *golang_image
    environment: *ko_env
    commands:
      - go install github.com/google/ko@$KO_VERSION
      # --bare: publish to exactly $KO_DOCKER_REPO rather than appending a
      # package-name/hash suffix, matching the reference the deploy step reads.
      #
      # --image-refs records the published reference INCLUDING its digest
      # (repo@sha256:…). That file is why deploying lives in this workflow: the
      # digest exists only after the push, workflows don't share a workspace, and
      # a binary can't derive its own image digest — so this is the one place the
      # value can be captured and handed to the deployment.
      - ko build --bare --tags "$CI_COMMIT_SHA" --image-refs image-ref --sbom=spdx ./cmd/meshtender
    backend_options: *registry_secret
    when:
      - event: push
        branch: main

  publish-tag:
    image: *golang_image
    environment: *ko_env
    commands:
      - go install github.com/google/ko@$KO_VERSION
      # On a git tag: strip a leading "v" so v1.2.3 -> 1.2.3.
      - ko build --bare --tags "${CI_COMMIT_TAG##v}" --sbom=spdx ./cmd/meshtender
    backend_options: *registry_secret
    when:
      - event: tag

  # Deploys by DIGEST rather than by the commit-SHA tag, and passes that same
  # digest to the app as MESHTENDER_IMAGE_DIGEST so /version can report what is
  # actually running (see "Verifying a build" in README.md).
  #
  # One strategic-merge patch sets the image and the env var together, so the
  # rollout that picks up the new image is the same one that picks up its digest —
  # `set image` followed by `set env` would trigger two rollouts and leave a
  # window where the reported digest belongs to the previous release. Strategic
  # merge keys containers by name and env by name, so unrelated env vars on the
  # Deployment are preserved.
  deploy:
    image: alpine/kubectl:1.35.3
    commands:
      # Shell variables stay bare ($IMAGE, never brace-wrapped): Woodpecker runs
      # its own substitution over this file before the shell sees it, and it
      # replaces a brace-wrapped name with the CI value — empty, for a variable
      # only the shell knows. $(…) and bare $VAR are passed through untouched, so
      # the digest is cut with a command rather than a brace expansion.
      #
      # That substitution reads the whole file, comments included, and rejects
      # anything brace-wrapped that isn't a valid variable name — which is why
      # this comment describes the trap instead of quoting it. A malformed one
      # fails the pipeline before any step runs, with "unable to parse variable
      # name" and no indication of where. TestWoodpeckerVariablesAreParseable
      # catches it locally instead.
      - IMAGE="$(cat image-ref)"
      - DIGEST="$(cut -d@ -f2 image-ref)"
      # Fail loudly rather than deploying with an empty/garbled digest: the app
      # rejects a malformed MESHTENDER_IMAGE_DIGEST at startup, so a bad value
      # here would take the deployment down rather than merely misreport.
      - |
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "no digest in image ref: $IMAGE" >&2; exit 1 ;;
        esac
      - |
        kubectl patch deployment/meshtender -n mesh --type=strategic -p "{
          \"spec\": {\"template\": {\"spec\": {\"containers\": [{
            \"name\": \"meshtender\",
            \"image\": \"$IMAGE\",
            \"env\": [{\"name\": \"MESHTENDER_IMAGE_DIGEST\", \"value\": \"$DIGEST\"}]
          }]}}}
        }"
      - kubectl rollout status -n mesh deployment/meshtender --timeout=120s
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-ci-deployer
    when:
      - event: push
        branch: main
