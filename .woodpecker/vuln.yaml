# Scans dependencies and the Go stdlib for known, reachable vulnerabilities
# (govulncheck uses call-graph analysis, so it flags CVEs the code actually
# reaches, not just present-in-go.sum). Runs on every push and PR; the build
# depends on it, so a reachable advisory blocks the image build and deploy.
# Tracks the tool's latest, matching lint.yaml's :latest philosophy; the vuln DB
# is fetched at run.
when:
  - event: [push, pull_request]

steps:
  govulncheck:
    image: golang:1.26.5
    environment:
      # go.mod may target a newer Go than the image bundles; fetch on demand.
      GOTOOLCHAIN: auto
    commands:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - govulncheck ./...

depends_on: []
