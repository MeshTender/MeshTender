[tools]
go = "latest"
"golangci-lint" = "latest"
pitchfork = "latest"

[env]
_.file = ".env"

[deps.go]
auto = true

[tasks.dev]
run = "go run ./cmd/meshtender"

[tasks.lint]
run = "golangci-lint run"

[tasks.seed]
run = "go run ./cmd/meshtender --seed"

[tasks.reset]
run = "go run ./cmd/meshtender --reset"
