[tools]
# Go is pinned exactly, not floating: the published image is meant to be
# byte-for-byte reproducible by an outside auditor, and a different compiler
# version produces a different binary. Bump this together with GOTOOLCHAIN
# below, the `go` directive in go.mod, and the builder image in
# the publish job in .github/workflows/ci.yml.
go = "1.26.5"
"golangci-lint" = "latest"
pitchfork = "latest"
# Builds the OCI image (see .ko.yaml). Pinned for the same reason as Go.
"aqua:ko-build/ko" = "0.19.1"

[env]
_.file = ".env"
# Force the exact compiler, not merely "at least the go.mod version": with
# GOTOOLCHAIN=auto a developer on a newer Go would build a different binary
# from the same commit. Keep in sync with the `go` pin above.
GOTOOLCHAIN = "go1.26.5"

[deps.go]
auto = true

[tasks.dev]
run = "go run ./cmd/meshtender"

[tasks.lint]
run = "golangci-lint run"

# Builds the OCI image with ko (configured in .ko.yaml). There is no Dockerfile:
# the app is pure Go with everything embedded, so ko lays the binary straight
# onto a digest-pinned base image with zeroed layer timestamps.
#
# The default run pushes nothing and just prints the image digest — that is the
# value an auditor compares against a published release, and it does not depend
# on our registry (the repo name is not part of the digest). `--load` instead
# loads the image into the local Docker daemon so it can actually be run.
#
# The digest is only reproducible from a CLEAN checkout of the exact commit: Go
# stamps the commit SHA, commit time, and dirty flag into the binary. See
# "Verifying a build" in README.md.
[tasks.image]
usage = '''
flag "-l --load" help="Load the image into the local Docker daemon instead of only printing its digest"
flag "-p --platform <platform>" help="Target platform (default linux/amd64)"
'''
run = """
platform="${usage_platform:-linux/amd64}"
if [ -n "${usage_load:-}" ]; then
  KO_DOCKER_REPO=ko.local ko build --platform="$platform" --sbom=none ./cmd/meshtender
else
  KO_DOCKER_REPO=meshtender ko build --bare --push=false --platform="$platform" --sbom=none ./cmd/meshtender
fi
"""

# Audits every third-party dependency: scans the Go module graph (including
# test-only and browser-tagged deps) plus the non-Go manifest in
# internal/licenses, and fails if anything is not permissively licensed or if
# THIRD-PARTY-NOTICES.md has drifted. Copyleft terms would constrain how
# MeshTender itself may be licensed, so this is a licensing gate, not a lint.
[tasks.licenses]
usage = '''
flag "-u --update" help="Rewrite THIRD-PARTY-NOTICES.md instead of only checking it"
'''
run = 'go run ./cmd/licenses ${usage_update:+--update}'

[tasks.seed]
run = "go run ./cmd/meshtender --seed"

[tasks.reset]
run = "go run ./cmd/meshtender --reset"

# Runs the browser e2e suite against a throwaway chromedp/headless-shell container.
# Always use this rather than hand-rolling the container — the trap guarantees the
# container is torn down however the run ends (success, failure, or interrupt), so
# no orphaned containers hold port 9222. Filter to specific tests with
# `mise run e2e --run <regex>` (see `mise run e2e --help`).
[tasks.e2e]
usage = '''
flag "-r --run <regex>" help="Only run browser tests matching this regex (go test -run), verbosely"
'''
run = """
docker rm -f mt-headless >/dev/null 2>&1 || true
docker run -d --rm --name mt-headless -p 9222:9222 \
  --add-host=host.docker.internal:host-gateway \
  --entrypoint bash chromedp/headless-shell:latest -c \
  'socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223 & exec /headless-shell/headless-shell --no-sandbox --use-gl=angle --use-angle=swiftshader --remote-debugging-address=0.0.0.0 --remote-debugging-port=9223 "--host-resolver-rules=MAP *.host.docker.internal host.docker.internal"' >/dev/null
trap 'docker rm -f mt-headless >/dev/null 2>&1' EXIT
# Bounded readiness wait (~20s cap) so a container that never comes up can't hang.
for _ in $(seq 1 40); do curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep 0.5; done
go test -tags browser ./internal/e2e/ -timeout 180s ${usage_run:+-run "$usage_run" -v}
"""
